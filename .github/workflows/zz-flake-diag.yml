# TEMPORARY (do not merge): A/B for the stubbed-POST e2e flake.
# The old cy.intercept-stubbed narrative test and the in-page version, looped
# on pinned Chrome for Testing 155 builds,
# with Chrome's stderr in the log (DEBUG=cypress:launcher:browsers).
name: Flake diag

on:
  push:
    branches: [cypress-post-stub-hardening]

permissions:
  contents: read

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { chrome: '155.0.8059.39', mode: control, n: 1 }
          - { chrome: '155.0.8059.39', mode: control, n: 2 }
          - { chrome: '155.0.8059.39', mode: control, n: 3 }
          - { chrome: '155.0.8059.84', mode: control, n: 1 }
          - { chrome: '155.0.8059.84', mode: control, n: 2 }
          - { chrome: '155.0.8059.84', mode: control, n: 3 }
          - { chrome: '155.0.8059.84', mode: control, n: 4 }
          - { chrome: '155.0.8059.39', mode: inpage, n: 1 }
          - { chrome: '155.0.8059.39', mode: inpage, n: 2 }
          - { chrome: '155.0.8059.39', mode: inpage, n: 3 }
    name: chrome ${{ matrix.chrome }} ${{ matrix.mode }} ${{ matrix.n }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Start dev server
        run: npm run dev &
        env:
          NODE_ENV: test
          VITE_WORKER_URL: https://eyewall-poller.billowing-queen-bf23.workers.dev
      - run: npx wait-on http://localhost:5173 --timeout 30000
      - name: Pick Chrome
        id: chrome
        run: |
          out=$(npx -y @puppeteer/browsers install chrome@${{ matrix.chrome }} --path "$RUNNER_TEMP/cft" | tail -1)
          echo "$out"
          echo "browser=${out##* }" >> "$GITHUB_OUTPUT"
      - name: Loop
        run: npx cypress run --browser "${{ steps.chrome.outputs.browser }}" --spec cypress/e2e/zz-diag-ab.cy.js --expose DIAG_MODE=${{ matrix.mode }} 2>&1 | tee cypress-loop.log
        env:
          DEBUG: cypress:launcher:browsers
          VITE_WORKER_URL: https://eyewall-poller.billowing-queen-bf23.workers.dev
      - name: Summary
        if: always()
        run: |
          echo "network service crashes: $(grep -c 'Network service crashed' cypress-loop.log || true)"
          grep -E 'Network service crashed|DIAG FAIL|ws close|fetch!|beforeunload|Passing:|Failing:' cypress-loop.log | head -200 || true
