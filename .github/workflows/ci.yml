name: CI

# One workflow for every PR: lint + unit tests + build, then Cypress E2E.
# (This used to be two workflows -- ci.yml and test.yml -- that both ran the
# unit tests, on different Node versions.)

on:
  pull_request:
    branches: [main, staging]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.editorconfig'
      - 'LICENSE'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_WORKER_URL: ${{ secrets.VITE_WORKER_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

  # Cypress, split across parallel shards by cypress-split (cypress.config.js).
  # One job ran every spec in ~23-29 min against a 30-min limit, and got cut
  # off on its last spec (2026-10-02, #416). Three shards, balanced by the
  # per-spec times in cypress/timings.json, take ~10 min of specs each.
  # Refresh that file now and then (any spec missing from it is given the
  # average time); its numbers only steer the split, never pass or fail.
  e2e-shard:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # Let every shard finish, so one failure doesn't hide another's
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      # ── Checkout ────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v7

      # ── Node setup with npm cache ───────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # ── Install dependencies ────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── Start dev server in background ─────────────────────
      # Vite proxies NHL API and Supabase calls, so Cypress
      # needs the dev server running, not just a static build.
      - name: Start dev server
        run: npm run dev &
        env:
          NODE_ENV: test
          VITE_WORKER_URL: https://eyewall-poller.billowing-queen-bf23.workers.dev

      # ── Wait for dev server to be ready ────────────────────
      - name: Wait for dev server
        run: npx wait-on http://localhost:5173 --timeout 30000

      # ── Cypress e2e tests ───────────────────────────────────
      - name: E2E tests (Cypress)
        uses: cypress-io/github-action@v7
        with:
          # Don't install — we already ran npm ci above
          install: false
          # Don't start a server — we started it above
          start: ''
          wait-on: 'http://localhost:5173'
          wait-on-timeout: 30
          browser: chrome
          headless: true
          # Record to Cypress Cloud if CYPRESS_RECORD_KEY is set
          # (optional — remove this block if not using Cypress Cloud)
          record: ${{ secrets.CYPRESS_RECORD_KEY != '' }}
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          # This shard's share of the specs (cypress-split)
          SPLIT: ${{ strategy.job-total }}
          SPLIT_INDEX: ${{ strategy.job-index }}
          SPLIT_FILE: cypress/timings.json
          # Pass Supabase anon key so Cypress env block can read it
          CYPRESS_SUPABASE_ANON: sb_publishable_e_zwr1UA7GnHq4OuQSas5Q_kO8bQ_Ct
          VITE_WORKER_URL: https://eyewall-poller.billowing-queen-bf23.workers.dev

      # ── Generate HTML report ────────────────────────────────
      - name: Generate test report
        if: always()
        run: |
          npx mochawesome-merge cypress/reports/json/*.json > cypress/reports/merged.json
          npx marge cypress/reports/merged.json --reportDir cypress/reports/html --inline
        continue-on-error: true

      # ── Upload HTML report ──────────────────────────────────
      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cypress-report-${{ matrix.shard }}
          path: cypress/reports/html/merged.html
          if-no-files-found: ignore
          retention-days: 14

      # ── Upload Cypress screenshots on failure ───────────────
      # If a test fails, you'll see a screenshot of exactly what
      # the browser saw in the Actions run artifacts.
      - name: Upload failure screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-screenshots-${{ matrix.shard }}
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

      # ── Upload Cypress videos (always) ──────────────────────
      # Full recordings of every test run — useful for debugging
      # flaky tests. Remove this step if you don't need videos.
      - name: Upload test videos
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cypress-videos-${{ matrix.shard }}
          path: cypress/videos
          if-no-files-found: ignore
          retention-days: 3

  # One "e2e" result for the PR, as before the split: passes only when every
  # shard did.
  e2e:
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All shards passed
        run: |
          echo "e2e shards: ${{ needs.e2e-shard.result }}"
          test "${{ needs.e2e-shard.result }}" = "success"
