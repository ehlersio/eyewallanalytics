name: CI

# One workflow for every PR: lint + unit tests + build, then Cypress E2E.
# (This used to be two workflows -- ci.yml and test.yml -- that both ran the
# unit tests, on different Node versions.)

on:
  pull_request:
    branches: [main, staging]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.editorconfig'
      - 'LICENSE'

# The default GITHUB_TOKEN is read-only at the repository level too; this
# block makes that explicit per workflow (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  # Flags a PR that adds or upgrades to a dependency with a high/critical
  # advisory (any dependency, dev included, since it reads the lockfile
  # diff). No PR comment, so it needs only read access.
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fail on a high/critical advisory in anything the site ships. .npmrc
      # sets include=dev, which overrides --omit=dev and would pull the
      # devDependencies (Cypress tooling, ~9 highs as of 2026-10) into the
      # audit; --include=prod replaces it, so only production deps gate the
      # build. (An empty --include= does the same but npm warns it's invalid.)
      - name: Audit production dependencies
        run: npm audit --omit=dev --include=prod --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_WORKER_URL: ${{ secrets.VITE_WORKER_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

  # Cypress, split across parallel shards by cypress-split (cypress.config.js).
  # One job ran every spec in ~23-29 min against a 30-min limit, and got cut
  # off on its last spec (2026-10-02, #416). Four shards, balanced by the
  # per-spec times in cypress/timings.json, take ~8 min of specs each
  # (2026-10-27; three took 10-13 min once the file had gone stale).
  # Refresh that file now and then (any spec missing from it is given the
  # average time); its numbers only steer the split, never pass or fail.
  e2e-shard:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # Let every shard finish, so one failure doesn't hide another's
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      # ── Checkout ────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── Node setup with npm cache ───────────────────────────
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      # ── Install dependencies ────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── Start dev server in background ─────────────────────
      # Vite proxies NHL API and Supabase calls, so Cypress
      # needs the dev server running, not just a static build.
      - name: Start dev server
        run: npm run dev &
        env:
          NODE_ENV: test
          VITE_WORKER_URL: https://eyewall-poller.billowing-queen-bf23.workers.dev

      # ── Wait for dev server to be ready ────────────────────
      - name: Wait for dev server
        run: npx wait-on http://localhost:5173 --timeout 30000

      # ── Chrome ──────────────────────────────────────────────
      # Chrome 155.0.8059.39 crashes its network service when Cypress's
      # proxy answers a stubbed POST, dropping every connection mid-test
      # (#546); some runner images shipped it in 2026-10. On a build listed
      # here, the shard runs the current stable Chrome for Testing instead
      # (and stops if that's listed too); otherwise the runner's own Chrome.
      - name: Pick Chrome
        id: chrome
        env:
          BAD_CHROME_BUILDS: 155.0.8059.39
        run: |
          version=$(google-chrome --version | grep -oE '[0-9]+(\.[0-9]+){3}')
          echo "Runner Chrome: $version"
          if [[ " $BAD_CHROME_BUILDS " != *" $version "* ]]; then
            echo "browser=chrome" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning::Runner Chrome $version is in BAD_CHROME_BUILDS (#546); using stable Chrome for Testing"
          url=$(curl -fsSL https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json \
            | jq -r '.channels.Stable.downloads.chrome[] | select(.platform == "linux64") | .url')
          curl -fsSL "$url" -o "$RUNNER_TEMP/chrome-linux64.zip"
          unzip -q "$RUNNER_TEMP/chrome-linux64.zip" -d "$RUNNER_TEMP"
          chrome="$RUNNER_TEMP/chrome-linux64/chrome"
          cft=$("$chrome" --version | grep -oE '[0-9]+(\.[0-9]+){3}')
          echo "Chrome for Testing: $cft"
          if [[ " $BAD_CHROME_BUILDS " == *" $cft "* ]]; then
            echo "::error::Chrome for Testing $cft is in BAD_CHROME_BUILDS too"
            exit 1
          fi
          echo "browser=$chrome" >> "$GITHUB_OUTPUT"

      # ── Cypress e2e tests ───────────────────────────────────
      - name: E2E tests (Cypress)
        uses: cypress-io/github-action@bc982daf1fc26474fa0cf2c355d6c910616ce411 # v7.4.7
        with:
          # Don't install — we already ran npm ci above
          install: false
          # Don't start a server — we started it above
          start: ''
          wait-on: 'http://localhost:5173'
          wait-on-timeout: 30
          browser: ${{ steps.chrome.outputs.browser }}
          headless: true
          # Record to Cypress Cloud if CYPRESS_RECORD_KEY is set
          # (optional — remove this block if not using Cypress Cloud)
          record: ${{ secrets.CYPRESS_RECORD_KEY != '' }}
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          # This shard's share of the specs (cypress-split)
          SPLIT: ${{ strategy.job-total }}
          SPLIT_INDEX: ${{ strategy.job-index }}
          SPLIT_FILE: cypress/timings.json
          # Pass Supabase anon key so Cypress env block can read it
          CYPRESS_SUPABASE_ANON: sb_publishable_e_zwr1UA7GnHq4OuQSas5Q_kO8bQ_Ct
          VITE_WORKER_URL: https://eyewall-poller.billowing-queen-bf23.workers.dev

      # ── Generate HTML report ────────────────────────────────
      - name: Generate test report
        if: always()
        run: |
          npx mochawesome-merge cypress/reports/json/*.json > cypress/reports/merged.json
          npx marge cypress/reports/merged.json --reportDir cypress/reports/html --inline
        continue-on-error: true

      # ── Upload HTML report ──────────────────────────────────
      - name: Upload test report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cypress-report-${{ matrix.shard }}
          path: cypress/reports/html/merged.html
          if-no-files-found: ignore
          retention-days: 14

      # ── Upload Cypress screenshots on failure ───────────────
      # If a test fails, you'll see a screenshot of exactly what
      # the browser saw in the Actions run artifacts.
      - name: Upload failure screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: cypress-screenshots-${{ matrix.shard }}
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

      # ── Upload Cypress videos (always) ──────────────────────
      # Full recordings of every test run — useful for debugging
      # flaky tests. Remove this step if you don't need videos.
      - name: Upload test videos
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cypress-videos-${{ matrix.shard }}
          path: cypress/videos
          if-no-files-found: ignore
          retention-days: 3

  # One "e2e" result for the PR, as before the split: passes only when every
  # shard did.
  e2e:
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All shards passed
        run: |
          echo "e2e shards: ${{ needs.e2e-shard.result }}"
          test "${{ needs.e2e-shard.result }}" = "success"
