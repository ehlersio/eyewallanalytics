<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to resolve
         to anything other than 0 on devices with rounded corners / display
         cutouts — BottomNav.css relies on this (Session 43, Track C). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080c14" />
    <meta name="description" content="EyeWall Analytics — Carolina Hurricanes advanced stats and analytics" />

    <!-- PWA manifest (enables Add to Home Screen + iOS push) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EyeWall" />
    <link rel="apple-touch-icon" href="/favicon-192.png" />
    <title>EyeWall Analytics</title>

    <!-- Favicons — ico first so all browsers pick it up -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32"  href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64"  href="/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon"      sizes="192x192" href="/favicon-192.png" />

    <!-- Open Graph -->
    <meta property="og:title"       content="EyeWall Analytics" />
    <meta property="og:description" content="Carolina Hurricanes advanced stats and analytics" />
    <meta property="og:image"       content="/eyewall-logo.png" />
    <meta property="og:type"        content="website" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Preconnect to external origins for faster initial requests -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://mqgasjzywoibdgxjjkux.supabase.co" />
    <link rel="preconnect" href="https://eyewall-poller.billowing-queen-bf23.workers.dev" />

    <!-- Google Fonts — display=swap prevents render blocking -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=optional" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
