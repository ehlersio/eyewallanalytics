<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080c14" />
    <meta name="description" content="EyeWall Analytics — Carolina Hurricanes advanced stats and analytics" />

    <!-- PWA manifest (enables Add to Home Screen + iOS push) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EyeWall" />
    <link rel="apple-touch-icon" href="/favicon-192.png" />
    <title>EyeWall Analytics</title>

    <!-- Favicons — ico first so all browsers pick it up -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32"  href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64"  href="/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon"      sizes="192x192" href="/favicon-192.png" />

    <!-- Open Graph -->
    <meta property="og:title"       content="EyeWall Analytics" />
    <meta property="og:description" content="Carolina Hurricanes advanced stats and analytics" />
    <meta property="og:image"       content="/eyewall-logo.png" />
    <meta property="og:type"        content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
