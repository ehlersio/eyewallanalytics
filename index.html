<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to resolve
         to anything other than 0 on devices with rounded corners / display
         cutouts — BottomNav.css relies on this (Session 43, Track C). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080c14" />
    <!-- Paint the theme's background before the bundle loads -- the saved
         choice, else the device's setting (same rule as themeConfig.js) -- so
         the iOS launch splash hands off to the faceoff intro without a flash. -->
    <style>
      html { background: #0B1426; }
      html[data-theme="light"] { background: #F3F7FA; }
    </style>
    <script>
      try {
        var saved = localStorage.getItem('eyewall:theme');
        var light = saved ? saved === 'light'
          : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
        if (light) document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    </script>
    <meta name="description" content="EyeWall Analytics — NHL and PWHL advanced stats and analytics" />

    <!-- PWA manifest (enables Add to Home Screen + iOS push) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EyeWall" />
    <title>EyeWall Analytics</title>

    <!-- Favicons — ico first so all browsers pick it up -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32"  href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64"  href="/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />

    <!-- Open Graph -->
    <meta property="og:title"       content="EyeWall Analytics" />
    <meta property="og:description" content="NHL and PWHL advanced stats and analytics" />
    <meta property="og:image"       content="/favicon-512.png" />
    <meta property="og:type"        content="website" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Preconnect to external origins for faster initial requests -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://mqgasjzywoibdgxjjkux.supabase.co" />
    <link rel="preconnect" href="https://eyewall-poller.billowing-queen-bf23.workers.dev" />

    <!-- Google Fonts — display=swap prevents render blocking -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=optional" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
